# 一期同步 schema：按真实 Demo.xlsx 对齐（12 列）
# 列序：1 所属户籍站(丢) | 2 统计时间 | 3 居住地址(丢) | 4 编码编号 | 5 出生日期
#       6 性别 | 7 身份证 | 8 名字 | 9 手机号 | 10 地址 | 11 编码(丢) | 12 编码(丢)
# 真实表头如与此不一致，只需修改此文件，不需要改代码

source:
  # type: s3 | tos | oss | minio（全部走 S3 兼容协议，共用一个 S3Client）
  # 火山引擎 TOS 示例：endpoint 按 region 调整
  #   华北2(北京)  https://tos-s3-cn-beijing.volces.com
  #   华东2(上海)  https://tos-s3-cn-shanghai.volces.com
  #   华南1(广州)  https://tos-s3-cn-guangzhou.volces.com
  type: tos
  bucket: ${INGEST_BUCKET}
  prefix: huji/
  endpoint: ${TOS_ENDPOINT}
  region: ${TOS_REGION}
  force_path_style: true

  # 若切回 AWS S3：
  # type: s3
  # endpoint: ~
  # region: us-east-1
  # force_path_style: false

parse:
  skip_header_rows: 1
  sheet: 0

columns:
  drop_indexes: [1, 3, -1, -2]
  mappings:
    - index: 2
      field: stat_time
      transform: parse_date
    - index: 4
      field: huji_no
      transform: strip_prefix_digits
      transform_args: ["2016户籍统计"]
    - index: 5
      field: birth_date
      transform: parse_date
    - index: 6
      field: gender
      transform: map_gender
    - index: 7
      field: id_card
      transform: mask_id_card
    - index: 8
      field: name
      required: true
    - index: 9
      field: phone_masked
      transform: mask_phone_mid4
    - index: 10
      field: address

dedupe:
  key: id_card               # 文件内 / 批次内按身份证去重
  keep: last                 # first | last（按出现顺序）；默认 last
  cross_batch:
    on_conflict: update      # update(UPSERT) | skip | fail
    bump_version: true

sink:
  type: postgres
  table: customer
  batch_size: 2000
  conflict_key: id_card
